<!-- Header banner for the GitHub profile README.
     Self-hosted replacement for capsule-render.vercel.app (type=venom).
     Same organic morphing blob, same #FF6A00, same white text, same fadeIn -
     but the blob is a union of three overlapping copies of the venom path, sized so it
     fully backs BOTH text lines. The upstream endpoint drew a ~168px blob behind ~515px
     of white text, leaving most of the title invisible on GitHub's light theme. -->
